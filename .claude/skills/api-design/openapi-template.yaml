openapi: 3.0.3
info:
  title: <service>
  version: 0.1.0
paths:
  /things:
    get:
      summary: List things
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
